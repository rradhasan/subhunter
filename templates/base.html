<!doctype html>
<html>
  <head>
    <title>{% block title %}SubHunter{% endblock %}</title>
    <style>
      body {
        font-family: monospace;
        background: #1a1a1a;
        color: #00ff00;
        padding: 20px;
      }
      input {
        background: #333;
        color: #00ff00;
        border: 1px solid #00ff00;
        padding: 8px;
      }
      button {
        background: #00ff00;
        color: #000;
        padding: 8px 16px;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>[ SubHunter ]</h1>
    <!-- templates/base.html -->
    <nav
      style="
        margin-bottom: 20px;
        border-bottom: 1px solid #00ff00;
        padding-bottom: 10px;
      "
    >
      <a href="{{ url_for('home') }}" style="color: #00ff00; margin-right: 20px"
        >[Home]</a
      >
      <a
        href="{{ url_for('history') }}"
        style="color: #00ff00; margin-right: 20px"
        >[History]</a
      >
      <a
        href="{{ url_for('api_status') }}"
        style="color: #00ff00; margin-right: 20px"
        >[API Status]</a
      >
      <a href="{{ url_for('api_docs') }}" style="color: #00ff00; margin-right: 20px">[API Docs]</a>

      <a href="{{ url_for('account') }}" style="color: #00ff00; margin-right: 20px">[Accounts]</a>

      <!-- In base.html nav -->
      {% if session.username %}
      <span style="color: #00ff00">[ {{ session.username }} ]</span>
      <a
        href="{{ url_for('logout') }}"
        style="color: #ff0000; margin-left: 20px"
        >[Logout]</a
      >
      {% else %}
      <a href="{{ url_for('login') }}" style="color: #00ff00; margin-left: 20px"
        >[Login]</a
      >
      {% endif %}
    </nav>
    {% block content %}{% endblock %}
  </body>
</html>
