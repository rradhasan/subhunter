{% extends "base.html" %}
{% block title %} Change Password Subhunter {% endblock %}
{% block content %}
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p style="color: red;">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <div>
        <form action="{{ url_for('change_password') }}" method="post">
            <input type="password" name="current_password" id="current" placeholder="Current Password">
            <input type="password" name="new_password" id="new_password" placeholder="New Password">
            <input type="password" name="confirm_password" id="confirm" placeholder="Confirm Password">
            <input type="submit" value="Change Password">
        </form>
    </div>
{% endblock %}
